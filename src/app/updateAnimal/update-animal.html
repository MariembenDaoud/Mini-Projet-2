<div class="container">
  <div class="col-sm-4 col-md-4 col-lg-4 mx-auto mt-4">
    <h2>Modifier un Animal :</h2>

    <form (ngSubmit)="updateAnimal()">
      <div class="form-group mb-3">
        <label>Id Animal</label>
        <input
          readonly
          type="number"
          [(ngModel)]="currentAnimal.idAnimal"
          name="idAnimal"
          class="form-control"
        />
      </div>

      <div class="form-group mb-3">
        <label>Nom Animal</label>
        <input
          type="text"
          [(ngModel)]="currentAnimal.nomAnimal"
          name="nomAnimal"
          class="form-control"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label>Espèce</label>
        <input
          type="text"
          [(ngModel)]="currentAnimal.espece"
          name="espece"
          class="form-control"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label>Âge</label>
        <input
          type="number"
          [(ngModel)]="currentAnimal.age"
          name="age"
          class="form-control"
          min="0"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label>Date de naissance</label>
        <input
          type="date"
          [ngModel]="currentAnimal.dateNaissance | date: 'yyyy-MM-dd'"
          (ngModelChange)="changerDate($event)"
          name="dateNaissance"
          class="form-control"
        />
      </div>

      <button type="submit" class="btn btn-success">Modifier</button>
    </form>
  </div>
</div>
